# Expected elrace.notify.type rows. Templates match the inactive seed.
# expected_title / expected_body are the exact preview() result for `sample`.
types:
  - code: approval.waiting
    channel: push
    category: waiting
    action: open_record
    title_template: "New {request_type} Waiting for Your Approval"
    body_template: "{request_type} {reference} is waiting for your approval/action."
    mandatory: false
    exclude_labour: true
    exclude_actor: true
    active: false
    takeover: false
    shadow: false
    sample: {request_type: "Annual Leave Request", reference: "HR/001"}
    expected_title: "New Annual Leave Request Waiting for Your Approval"
    expected_body: "Annual Leave Request HR/001 is waiting for your approval/action."

