name: firebase-rules

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: firebase rules contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firebase/rules-tests/package-lock.json

      - name: Install rules tests
        run: npm ci --prefix firebase/rules-tests

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.25.0

      - name: Dart write contract
        run: flutter test test/firebase/firestore_write_contract_test.dart test/firebase/firebase_failure_rule_area_test.dart

      - name: Rules emulator
        run: |
          env -u DATABASE_EMULATOR_PORT -u FIRESTORE_EMULATOR_PORT -u STORAGE_EMULATOR_PORT \
            firebase emulators:exec --project elrace-new --only firestore,database,storage --non-interactive \
            "npm --prefix firebase/rules-tests test"
