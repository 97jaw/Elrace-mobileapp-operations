name: firebase-rules-deploy

# Rules ship only from main. A pull request cannot deploy.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - database.rules.json
      - firebase.json
      - .github/workflows/firebase-rules-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy rules from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_ELRACE_NEW: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELRACE_NEW }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_ELRACE_NEW" ]; then
            echo "::error::Add the GitHub secret FIREBASE_SERVICE_ACCOUNT_ELRACE_NEW (JSON key for a service account that can deploy Firebase rules on elrace-new)."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELRACE_NEW }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.25.0

      - name: Deploy rules only
        run: firebase deploy --only firestore:rules,storage,database --project elrace-new --non-interactive
